<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Budget | FinanceTracker</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="topbar"><div class="brand">Finance<span>Tracker</span></div><nav><a href="index.html">Dashboard</a><a href="transactions.html">Transactions</a><a href="budget.html" class="active">Budget</a></nav></header>
<main class="container">
<section class="hero compact"><div><p class="eyebrow">BUDGET</p><h1>Plan your spending.</h1><p class="muted">Set monthly limits and compare them with actual expenses.</p></div></section>
<section class="panel"><h3>Set Monthly Category Budget</h3>
<form id="budgetForm" class="form-grid">
<label>Category<select id="budgetCategory"></select></label>
<label>Monthly Limit<input id="budgetAmount" type="number" min="0" step="0.01" required placeholder="500"></label>
<div class="wide"><button class="button" type="submit">Save Budget</button></div>
</form><p id="budgetMessage" class="message"></p></section>
<section class="panel"><div class="panel-title"><h3>Budget Status</h3><button id="clearBudgets" class="secondary small">Clear Budgets</button></div><div id="budgetList"></div></section>
</main>
<footer>FinanceTracker — Software Engineering Final Project</footer>
<script src="js/app.js"></script><script src="js/budget.js"></script>
</body></html>
