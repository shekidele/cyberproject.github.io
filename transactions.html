<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions | FinanceTracker</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div class="brand">Finance<span>Tracker</span></div><nav><a href="index.html">Dashboard</a><a href="transactions.html" class="active">Transactions</a><a href="budget.html">Budget</a></nav></header>
<main class="container">
<section class="hero compact"><div><p class="eyebrow">TRANSACTIONS</p><h1>Manage your money.</h1><p class="muted">Add, edit and remove income or expenses.</p></div></section>

<section class="panel" id="add">
<h3 id="formTitle">Add Transaction</h3>
<form id="transactionForm" class="form-grid">
<input type="hidden" id="editId">
<label>Type<select id="type" required><option value="expense">Expense</option><option value="income">Income</option></select></label>
<label>Amount<input id="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></label>
<label>Category<select id="category" required></select></label>
<label>Date<input id="date" type="date" required></label>
<label class="wide">Description<input id="description" maxlength="80" required placeholder="e.g. Groceries"></label>
<div class="wide actions"><button class="button" type="submit">Save Transaction</button><button class="secondary hidden" id="cancelEdit" type="button">Cancel Edit</button></div>
</form>
<p id="formMessage" class="message"></p>
</section>

<section class="panel">
<div class="panel-title"><h3>Transaction History</h3><div class="filters"><input id="search" placeholder="Search..."><select id="filterType"><option value="all">All types</option><option value="income">Income</option><option value="expense">Expense</option></select></div></div>
<div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th>Amount</th><th>Action</th></tr></thead><tbody id="transactionRows"></tbody></table></div>
<p id="tableEmpty" class="empty hidden">No transactions found.</p>
</section>
</main>
<footer>FinanceTracker — Software Engineering Final Project</footer>
<script src="js/app.js"></script><script src="js/transactions.js"></script>
</body></html>
